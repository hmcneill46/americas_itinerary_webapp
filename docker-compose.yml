services:
  itinerary:
    build: .
    restart: unless-stopped
    ports:
      - "${ITINERARY_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      ITINERARY_HOST: 0.0.0.0
      ITINERARY_PORT: 8765
      ITINERARY_EDIT_TOKEN: "${ITINERARY_EDIT_TOKEN:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
